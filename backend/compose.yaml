# Base locale et boîte de réception de test pour ./mvnw spring-boot:run (mêmes valeurs que
# application.yaml) :
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gestion_financiere
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
  # Mailpit : garde les emails envoyés par le backend, sans rien envoyer à l'extérieur.
  # Lecture : http://localhost:8025 ; SMTP : localhost:1025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
