logging:
  level:
    root: ${LOG_LEVEL:info}

server:
  # Derrière le gateway, l'adresse vue par le navigateur commence par /backend (préfixe retiré
  # par le gateway, transmis dans X-Forwarded-Prefix) : nécessaire pour que la page Swagger
  # retrouve le contrat sur https://gateway.../backend/v3/api-docs.
  forward-headers-strategy: framework

spring:
  application:
    name: gestion-financiere
  # Base PostgreSQL. Valeurs locales (compose.yaml) ; sur le cluster, remplacées par
  # SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD (helm.yaml : database).
  datasource:
    url: jdbc:postgresql://localhost:5432/gestion_financiere
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma vient uniquement des migrations Flyway

pointeo:
  # Adresse de l'écran, pour les liens envoyés par email (mot de passe oublié).
  # Sur le cluster : POINTEO_FRONTEND_URL (helm.yaml).
  frontend-url: http://localhost:4200
  # Aucune API d'envoi d'emails n'est encore branchée. En mode test, le code reçu par email
  # et les liens des emails sont renvoyés à l'écran pour pouvoir se connecter.
  # Jamais en preprod/prod. Activé en local par ./mvnw spring-boot:run (pom.xml) et en
  # dev/qualif par POINTEO_MODE_TEST (helm.yaml).
  mode-test: false

# Contrat d'interface des API (Swagger / OpenAPI) : /swagger-ui.html et /v3/api-docs.
# Désactivé par défaut ; activé en local par ./mvnw spring-boot:run (pom.xml) et en dev/qualif
# par POINTEO_SWAGGER (helm.yaml). Jamais en preprod/prod.
springdoc:
  api-docs:
    enabled: ${POINTEO_SWAGGER:false}
  swagger-ui:
    enabled: ${POINTEO_SWAGGER:false}
