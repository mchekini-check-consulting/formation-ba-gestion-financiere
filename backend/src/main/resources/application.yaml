logging:
  level:
    root: ${LOG_LEVEL:info}

server:
  # Derrière le gateway, l'adresse vue par le navigateur commence par /backend (préfixe retiré
  # par le gateway, transmis dans X-Forwarded-Prefix) : nécessaire pour que la page Swagger
  # retrouve le contrat sur https://gateway.../backend/v3/api-docs.
  forward-headers-strategy: framework

spring:
  application:
    name: gestion-financiere
  # Base PostgreSQL. Valeurs locales (compose.yaml) ; sur le cluster, remplacées par
  # SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD (helm.yaml : database).
  datasource:
    url: jdbc:postgresql://localhost:5432/gestion_financiere
    username: app
    password: app
  # US-15 RG1 : factures de 10 Mo maximum, vérifié par l'application (message clair) ; la limite
  # du serveur est un peu au-dessus pour laisser passer l'enveloppe de l'envoi.
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 11MB
  # Kafka (facture/EvenementsFactureKafka) : adresse injectée par helm.yaml (KAFKA_BOOTSTRAP_SERVERS).
  # Envoi abandonné au bout de 5 s si Kafka ne répond pas, pour ne pas bloquer l'écran.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma vient uniquement des migrations Flyway

pointeo:
  # Adresse de l'écran, pour les liens envoyés par email (mot de passe oublié).
  # Sur le cluster : POINTEO_FRONTEND_URL (helm.yaml).
  frontend-url: http://localhost:4200
  # Envoi des emails (notification/EnvoiEmailConfiguration). Sans serveur SMTP (smtp-host vide) :
  # emails seulement tracés dans les logs. En local (./mvnw spring-boot:run, pom.xml) : Mailpit de
  # compose.yaml, emails lisibles sur http://localhost:8025. En dev/qualif (helm.yaml) : Mailpit
  # de la plateforme, https://mailpit.dev.check-consulting.net, étiquette <env>-formation-ba-gestion-financiere.
  email:
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:1025}
    smtp-tls: ${SMTP_TLS:false}
    smtp-user: ${SMTP_USER:}
    smtp-password: ${SMTP_PASSWORD:}
    expediteur: ${MAIL_FROM:noreply@pointeo.fr}
  # US-53 et US-54 Lecture automatique des factures : texte des photos et PDF scannés lu par le
  # programme Tesseract (facture/lecture/TesseractOcr), installé dans l'image du backend (Dockerfile).
  # Sans Tesseract (poste local) : photos et PDF scannés en « Lecture échouée » (saisie à la main) ;
  # les PDF avec texte restent lus normalement.
  ocr:
    tesseract: tesseract
    delai: 60s
  # US-58 Bouchon bancaire : transactions de démonstration (src/main/resources/bouchon/transactions.csv,
  # qui explique comment ajouter des données), source « Bouchon », sans connexion à un vrai compte.
  # Désactivé par défaut. Activé en local par ./mvnw spring-boot:run (pom.xml) et en dev/qualif par
  # POINTEO_BOUCHON_BANCAIRE (helm.yaml). Jamais en preprod/prod.
  bouchon-bancaire: ${POINTEO_BOUCHON_BANCAIRE:false}
  # Événements de facture sur Kafka (facture/EvenementsFactureKafka) : « facture traitée » à chaque
  # validation (US-55). Sans KAFKA_BOOTSTRAP_SERVERS (poste local, tests) : rien n'est envoyé.
  # En dev/qualif : Kafka de la plateforme (helm.yaml). Topic créé au premier envoi.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    topic-facture: ${KAFKA_TOPIC_FACTURE:facture}

# Contrat d'interface des API (Swagger / OpenAPI) : /swagger-ui.html et /v3/api-docs.
# Désactivé par défaut ; activé en local par ./mvnw spring-boot:run (pom.xml) et en dev/qualif
# par POINTEO_SWAGGER (helm.yaml). Jamais en preprod/prod.
springdoc:
  api-docs:
    enabled: ${POINTEO_SWAGGER:false}
  swagger-ui:
    enabled: ${POINTEO_SWAGGER:false}
