logging:
  level:
    root: ${LOG_LEVEL:info}

server:
  # Derrière le gateway, l'adresse vue par le navigateur commence par /backend (préfixe retiré
  # par le gateway, transmis dans X-Forwarded-Prefix) : nécessaire pour que la page Swagger
  # retrouve le contrat sur https://gateway.../backend/v3/api-docs.
  forward-headers-strategy: framework

spring:
  application:
    name: gestion-financiere
  # Base PostgreSQL. Valeurs locales (compose.yaml) ; sur le cluster, remplacées par
  # SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD (helm.yaml : database).
  datasource:
    url: jdbc:postgresql://localhost:5432/gestion_financiere
    username: app
    password: app
  # US-15 RG1 : factures de 10 Mo maximum, vérifié par l'application (message clair) ; la limite
  # du serveur est un peu au-dessus pour laisser passer l'enveloppe de l'envoi.
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma vient uniquement des migrations Flyway

pointeo:
  # Adresse de l'écran, pour les liens envoyés par email (mot de passe oublié).
  # Sur le cluster : POINTEO_FRONTEND_URL (helm.yaml).
  frontend-url: http://localhost:4200
  # Envoi des emails (notification/EnvoiEmailConfiguration). Sans serveur SMTP (smtp-host vide) :
  # emails seulement tracés dans les logs. En local (./mvnw spring-boot:run, pom.xml) : Mailpit de
  # compose.yaml, emails lisibles sur http://localhost:8025. En dev/qualif (helm.yaml) : Mailpit
  # de la plateforme, https://mailpit.dev.check-consulting.net, étiquette <env>-formation-ba-gestion-financiere.
  email:
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:1025}
    smtp-tls: ${SMTP_TLS:false}
    smtp-user: ${SMTP_USER:}
    smtp-password: ${SMTP_PASSWORD:}
    expediteur: ${MAIL_FROM:noreply@pointeo.fr}
  # Mode test : bouton « factures d'exemple » d'un dossier (le dépôt de factures n'existe pas encore).
  # Les codes et liens des emails ne sont jamais renvoyés à l'écran : ils arrivent par email (Mailpit).
  # Jamais en preprod/prod. Activé en local par ./mvnw spring-boot:run (pom.xml) et en
  # dev/qualif par POINTEO_MODE_TEST (helm.yaml).
  mode-test: false

# Contrat d'interface des API (Swagger / OpenAPI) : /swagger-ui.html et /v3/api-docs.
# Désactivé par défaut ; activé en local par ./mvnw spring-boot:run (pom.xml) et en dev/qualif
# par POINTEO_SWAGGER (helm.yaml). Jamais en preprod/prod.
springdoc:
  api-docs:
    enabled: ${POINTEO_SWAGGER:false}
  swagger-ui:
    enabled: ${POINTEO_SWAGGER:false}
