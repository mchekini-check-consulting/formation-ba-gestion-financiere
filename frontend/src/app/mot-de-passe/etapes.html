<aside class="aside aside--top">
  <a routerLink="/" class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
      <rect width="30" height="30" rx="9" fill="#8C6B36"></rect>
      <path d="M9 15.5l4.2 4.2L21.5 11" fill="none" stroke="#FFFDF9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <span>Pointéo</span>
  </a>
  <ol class="steps">
    <li>
      <span class="steps__num" [class.steps__num--actif]="etape() === 1">1</span>
      <span class="steps__texte">
        <strong>Demandez un lien</strong>
        <span>Valable 1 heure, utilisable une seule fois.</span>
      </span>
    </li>
    <li>
      <span class="steps__num" [class.steps__num--actif]="etape() === 2">2</span>
      <span class="steps__texte">
        <strong>Choisissez un nouveau mot de passe</strong>
        <span>Vos autres sessions seront fermées par sécurité.</span>
      </span>
    </li>
  </ol>
</aside>
