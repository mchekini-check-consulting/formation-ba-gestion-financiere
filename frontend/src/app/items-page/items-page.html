<main class="items">
  <h1>Items</h1>

  <form (submit)="ajouter($event, nom, description)">
    <label>
      Nom
      <input #nom name="nom" required maxlength="200" />
    </label>
    <label>
      Description
      <input #description name="description" maxlength="1000" />
    </label>
    <button type="submit">Ajouter</button>
  </form>

  @if (erreur()) {
    <p class="erreur" role="alert">{{ erreur() }}</p>
  }

  <ul>
    @for (item of items(); track item.id) {
      <li>
        <strong>{{ item.nom }}</strong>
        @if (item.description) {
          <span> : {{ item.description }}</span>
        }
      </li>
    } @empty {
      <li class="vide">Aucun item</li>
    }
  </ul>
</main>
