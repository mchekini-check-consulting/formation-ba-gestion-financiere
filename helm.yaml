# Microservices de ce dépôt, déployés par formation-ba-gitops sur chaque environnement.
# Valeurs littérales uniquement. replicas, tag et envList[].value acceptent
# une valeur unique ou une map par environnement : { dev: ..., qualif: ..., preprod: ..., prod: ... }
# URL : frontend/gateway https://<application>.formation-ba-gestion-financiere.<env>.check-consulting.net
#       backend : jamais d'URL directe (Service ClusterIP seulement), exposé par
#       le pod "gateway" ci-dessous (type: gateway) : .../gateway/<backend>/...
applications:
  - name: backend
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-gestion-financiere/backend
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: 3e29d83
      qualif: 3e29d83
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    # Pas d'Ingress direct : Service ClusterIP seulement. Exposé par le pod
    # "gateway" ci-dessous :
    #   https://gateway.formation-ba-gestion-financiere.<env>.check-consulting.net/backend/...  (préfixe retiré)
    # Appelable depuis le navigateur uniquement par les frontends de l'environnement (CORS).
    # Base PostgreSQL gestion_financiere : créée et sauvegardée automatiquement.
    # Consigne : dans backend/src/main/resources/application.yaml, déclarer
    #   spring.datasource.url, spring.datasource.username, spring.datasource.password
    # (valeurs locales) ; sur le cluster, Spring Boot les remplace par les variables
    # injectées SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
    database:
      name: gestion_financiere
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
  - name: gateway
    type: gateway
    # Pas d'image/tag : fourni par la plateforme (petit Traefik autonome),
    # rien à construire ni à promouvoir. Expose les backends ci-dessus
    # (type: backend) sous https://gateway.formation-ba-gestion-financiere.<env>.check-consulting.net/<backend>/...
    # (préfixe retiré) ; CORS limité aux frontends de l'environnement.
    # Configuration personnalisée (routage, rate limiting, authentification
    # centralisée...) : voir gateway.yaml à la racine du dépôt. Si ce fichier
    # est absent, le routage vers les backends ci-dessus est généré
    # automatiquement (comportement par défaut).
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    ingress:
      enabled: true
  - name: frontend
    type: frontend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-gestion-financiere/frontend
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: 06cb764
      qualif: 06cb764
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    ingress:
      enabled: true
      path: /
      stripPrefix: false
